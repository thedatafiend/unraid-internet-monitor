<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Internet Monitor</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/uPlot.iife.min.js" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <a id="brandLink" class="brand" href="#/" aria-label="Internet Monitor">
    <!-- The Unraid template's icon (unraid/icon.svg); the dot follows the connection state. -->
    <svg id="brandLogo" class="brand-logo" viewBox="0 0 256 256" aria-hidden="true">
      <rect width="256" height="256" rx="56" fill="#1a1a19"/>
      <path d="M28 150 H84 L104 96 L132 188 L156 70 L176 150 H228" fill="none" stroke="#3987e5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <circle id="brandDot" cx="204" cy="60" r="22" fill="#898781" stroke="#1a1a19" stroke-width="8"/>
    </svg>
    <span class="brand-text">Internet Monitor</span>
  </a>
  <nav id="nav" aria-label="Sections">
    <a href="#/" data-route="">Dashboard</a>
    <a href="#/history" data-route="history">History</a>
    <a href="#/events" data-route="events">Events</a>
    <a href="#/compare" data-route="compare">Compare</a>
    <a href="#/speed" data-route="speed">Speed</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>
  <button id="themeBtn" class="btn ghost" type="button" aria-label="Color theme">Theme: auto</button>
</header>
<main id="view" tabindex="-1"></main>
</body>
</html>
